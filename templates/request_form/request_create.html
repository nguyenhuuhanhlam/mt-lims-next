{% extends "base.html" %}

{% block title %}Tạo phiếu yêu cầu · MT-LIMS{% endblock %}
{% block breadcrumb %}Phiếu yêu cầu · Tạo mới{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-5 py-10">
  
  <!-- Header Section -->
  <div class="flex items-center gap-3 mb-8">
    <div class="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center text-indigo-600 shadow-sm border border-indigo-100/50">
      <i data-lucide="file-plus-2" class="w-5 h-5"></i>
    </div>
    <div>
      <h1 class="text-lg font-bold text-gray-900">Tạo phiếu yêu cầu mới</h1>
      <p class="text-[12px] text-gray-400 mt-0.5 font-medium">Điền đầy đủ thông tin bên dưới để khởi tạo.</p>
    </div>
  </div>

  <!-- Form Card -->
  <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm">
    <form method="post" class="space-y-6">
      {% csrf_token %}

      <!-- Grid for Title and Type -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Title -->
        <div class="md:col-span-2 space-y-1.5">
          <label for="id_title" class="flex items-center gap-2 text-[9px] font-bold text-gray-400 uppercase tracking-widest">
            Tiêu đề yêu cầu <span class="text-red-400">*</span>
          </label>
          <input type="text" name="title" id="id_title" required
            value="{{ form.title.value|default:'' }}"
            placeholder="Ví dụ: Hợp đồng tháng 5"
            class="w-full px-3 py-2 text-[13px] font-semibold border border-gray-100 bg-gray-50/30 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all" />
        </div>

        <!-- Type -->
        <div class="space-y-1.5">
          <label for="id_type" class="flex items-center gap-2 text-[9px] font-bold text-gray-400 uppercase tracking-widest">
            Loại phiếu <span class="text-red-400">*</span>
          </label>
          <select name="type" id="id_type"
            class="w-full px-3 py-2 text-[13px] font-bold border border-gray-100 bg-gray-50/30 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all appearance-none cursor-pointer">
            <option value="slip" {% if form.type.value == 'slip' %}selected{% endif %}>Phiếu lẻ</option>
            <option value="contract" {% if form.type.value == 'contract' %}selected{% endif %}>Hợp đồng</option>
          </select>
        </div>
      </div>

      <!-- User Selection -->
      <div class="space-y-1.5">
        <label for="id_created_by" class="flex items-center gap-2 text-[9px] font-bold text-gray-400 uppercase tracking-widest">
          Người phụ trách <span class="text-red-400">*</span>
        </label>
        <select name="created_by" id="id_created_by" required
          class="w-full px-3 py-2 text-[13px] font-bold border border-gray-100 bg-gray-50/30 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all appearance-none cursor-pointer">
          {% for user in form.fields.created_by.queryset %}
            <option value="{{ user.id }}" {% if form.created_by.value|add:0 == user.id %}selected{% elif not form.created_by.value and request.user.id == user.id %}selected{% endif %}>
              {{ user.get_full_name|default:user.username }}
            </option>
          {% endfor %}
        </select>
      </div>

      <!-- Content -->
      <div class="space-y-1.5">
        <label for="id_content" class="flex items-center gap-2 text-[9px] font-bold text-gray-400 uppercase tracking-widest">
          Nội dung chi tiết <span class="text-red-400">*</span>
        </label>
        <textarea name="content" id="id_content" rows="4" required
          placeholder="Mô tả nội dung..."
          class="w-full px-3 py-3 text-[13px] font-medium border border-gray-100 bg-gray-50/30 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white placeholder-gray-300 resize-none transition-all">{{ form.content.value|default:'' }}</textarea>
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-end gap-3 pt-2">
        <a href="{% url 'request_list' %}"
          class="px-4 py-2 text-[12px] font-bold text-gray-400 hover:text-gray-900 transition-all">
          Huỷ bỏ
        </a>
        <button type="submit"
          class="flex items-center gap-2 px-6 py-2 bg-gray-900 text-white text-[12px] font-bold rounded-xl hover:bg-gray-800 transition-all shadow-sm">
          Lưu phiếu yêu cầu
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
