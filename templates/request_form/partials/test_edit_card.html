<div class="bg-indigo-50/30 border border-indigo-100 rounded-xl p-4 shadow-sm mb-3" id="test-card-{{ test.id }}">
  <div class="flex items-center justify-between mb-3 border-b border-indigo-100/50 pb-2">
    <span class="text-[12px] font-bold text-indigo-900">Chỉnh sửa Bài Test</span>
    <button type="button" hx-get="{% url 'test_cancel_edit' test.id %}" hx-target="#test-card-{{ test.id }}" hx-swap="outerHTML" class="text-gray-400 hover:text-gray-900">
      <i data-lucide="x" class="w-4 h-4"></i>
    </button>
  </div>
  
  <form hx-post="{% url 'test_edit' test.id %}" hx-target="#test-card-{{ test.id }}" hx-swap="outerHTML" class="space-y-3">
    {% csrf_token %}
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-[9px] font-bold text-gray-400 uppercase mb-1">Mã số</label>
        {{ form.test_code }}
      </div>
      <div>
        <label class="block text-[9px] font-bold text-gray-400 uppercase mb-1">Loại vật liệu</label>
        {{ form.material_type }}
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-[9px] font-bold text-gray-400 uppercase mb-1">Số lượng</label>
        {{ form.quantity }}
      </div>
      <div>
        <label class="block text-[9px] font-bold text-gray-400 uppercase mb-1">Đơn vị</label>
        {{ form.unit }}
      </div>
    </div>
    <div>
        <label class="block text-[9px] font-bold text-gray-400 uppercase mb-1">Nội dung</label>
        {{ form.content }}
    </div>
    <div class="flex justify-end pt-2 gap-2">
      <button type="button" hx-get="{% url 'test_cancel_edit' test.id %}" hx-target="#test-card-{{ test.id }}" hx-swap="outerHTML" class="px-3 py-1.5 text-[11px] font-bold text-gray-600 bg-white border border-gray-200 hover:bg-gray-50 rounded-lg transition-colors">Hủy</button>
      <button type="submit" class="px-3 py-1.5 text-[11px] font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm transition-colors">Lưu</button>
    </div>
  </form>
  <script>
    lucide.createIcons();
  </script>
</div>
