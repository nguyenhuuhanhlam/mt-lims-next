<aside class="sidebar-transition flex-shrink-0 flex flex-col border-r border-gray-100 bg-[#fafafa] overflow-hidden"
	:class="sidebarOpen ? 'w-[220px]' : 'w-[64px]'">

	<!-- Workspace Switcher -->
	<div class="p-3">
		<button
			class="w-full flex items-center gap-2 p-1.5 rounded-xl hover:bg-gray-200/50 transition-all group border border-transparent hover:border-gray-200/50 shadow-sm"
			:class="sidebarOpen ? '' : 'justify-center p-0 h-9 w-9 mx-auto'">
			<div
				class="w-8 h-8 rounded-lg bg-gray-900 flex items-center justify-center flex-shrink-0 shadow-lg shadow-gray-200">
				<span class="text-white text-xs font-bold">MT</span>
			</div>
			<div x-show="sidebarOpen" x-cloak class="text-left flex-1 min-w-0">
				<p class="text-sm font-semibold text-gray-900 leading-tight truncate">MT-LIMS</p>
				<p class="text-[10px] text-gray-400 font-medium">Workspace</p>
			</div>
			<i x-show="sidebarOpen" x-cloak data-lucide="chevrons-up-down"
				class="w-3.5 h-3.5 text-gray-400 group-hover:text-gray-600"></i>
		</button>
	</div>

	<!-- Search / Command Palette Shortcut -->
	<div class="px-3 py-0.5" x-show="sidebarOpen" x-cloak>
		<button
			class="w-full flex items-center gap-2 px-2.5 py-1.5 rounded-lg border border-gray-100 bg-white shadow-sm hover:border-gray-200 transition-all text-gray-400 group">
			<i data-lucide="search" class="w-3.5 h-3.5 text-gray-400 group-hover:text-gray-600"></i>
			<span class="text-[11px] font-medium">Tìm kiếm...</span>
			<span
				class="ml-auto flex items-center gap-0.5 text-[9px] font-bold text-gray-300 border border-gray-100 rounded px-1 py-0.5">
				<span class="text-[11px]">⌘</span>K
			</span>
		</button>
	</div>

	<!-- Nav Scroll Area -->
	<nav class="flex-1 overflow-y-auto px-2 py-3 space-y-0.5">

		<a href="{% url 'dashboard' %}"
			class="flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg text-sm text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-all group {% if request.resolver_match.url_name == 'dashboard' %}nav-active{% endif %}"
			:class="sidebarOpen ? '' : 'justify-center px-0'">
			<i data-lucide="layout-grid" class="w-3.5 h-3.5 flex-shrink-0"></i>
			<span x-show="sidebarOpen" x-cloak class="font-medium text-[13px]">Dashboard</span>
		</a>

		<!-- Group: Business -->
		<div class="pt-5 pb-1 px-3" x-show="sidebarOpen" x-cloak>
			<span class="text-[10px] font-bold text-gray-400 uppercase tracking-[0.1em]">Nghiệp vụ</span>
		</div>
		<div x-show="!sidebarOpen" class="border-t border-gray-100 my-4 mx-4"></div>

		<a href="{% url 'request_list' %}"
			class="flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg text-sm text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-all group {% if request.resolver_match.url_name == 'request_list' %}nav-active{% endif %}"
			:class="sidebarOpen ? '' : 'justify-center px-0'">
			<i data-lucide="file-text" class="w-3.5 h-3.5 flex-shrink-0"></i>
			<span x-show="sidebarOpen" x-cloak class="font-medium text-[13px]">Phiếu yêu cầu</span>
		</a>

		<a href="{% url 'material_test_list' %}"
			class="flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg text-sm text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-all group {% if request.resolver_match.url_name == 'material_test_list' %}nav-active{% endif %}"
			:class="sidebarOpen ? '' : 'justify-center px-0'">
			<i data-lucide="flask-conical" class="w-3.5 h-3.5 flex-shrink-0"></i>
			<span x-show="sidebarOpen" x-cloak class="font-medium text-[13px]">Thí nghiệm vật liệu</span>
		</a>

		<a href="#"
			class="flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg text-sm text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-all group"
			:class="sidebarOpen ? '' : 'justify-center px-0'">
			<i data-lucide="scroll-text" class="w-3.5 h-3.5 flex-shrink-0"></i>
			<span x-show="sidebarOpen" x-cloak class="font-medium text-[13px]">Hợp đồng</span>
			<span x-show="sidebarOpen" x-cloak
				class="ml-auto text-[8px] font-bold bg-gray-100 text-gray-400 rounded-full px-1.5 py-0.5">Soon</span>
		</a>

		<!-- Group: Personal -->
		<div class="pt-5 pb-1 px-3" x-show="sidebarOpen" x-cloak>
			<span class="text-[10px] font-bold text-gray-400 uppercase tracking-[0.1em]">Cá nhân</span>
		</div>
		<div x-show="!sidebarOpen" class="border-t border-gray-100 my-4 mx-4"></div>

		<a href="{% url 'user_tasks' %}"
			class="flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg text-sm text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-all group {% if request.resolver_match.url_name == 'user_tasks' %}nav-active{% endif %}"
			:class="sidebarOpen ? '' : 'justify-center px-0'">
			<i data-lucide="check-square" class="w-3.5 h-3.5 flex-shrink-0"></i>
			<span x-show="sidebarOpen" x-cloak class="font-medium text-[13px]">Nhiệm vụ của bạn</span>
		</a>

		{% if is_manager %}
		<!-- Group: System -->
		<div class="pt-5 pb-1 px-3" x-show="sidebarOpen" x-cloak>
			<span class="text-[10px] font-bold text-gray-400 uppercase tracking-[0.1em]">Hệ thống</span>
		</div>
		<div x-show="!sidebarOpen" class="border-t border-gray-100 my-4 mx-4"></div>

		<a href="{% url 'user_list' %}"
			class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-all group {% if request.resolver_match.url_name == 'user_list' %}nav-active{% endif %}"
			:class="sidebarOpen ? '' : 'justify-center px-0'">
			<i data-lucide="users" class="w-4 h-4 flex-shrink-0"></i>
			<span x-show="sidebarOpen" x-cloak class="font-medium text-[13px]">Người dùng</span>
		</a>

		<a href="{% url 'group_list' %}"
			class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-all group {% if request.resolver_match.url_name == 'group_list' %}nav-active{% endif %}"
			:class="sidebarOpen ? '' : 'justify-center px-0'">
			<i data-lucide="users-round" class="w-4 h-4 flex-shrink-0"></i>
			<span x-show="sidebarOpen" x-cloak class="font-medium text-[13px]">Nhóm</span>
		</a>
		{% endif %}

	</nav>

	<!-- Bottom: User + Logout -->
	<div class="p-3 bg-gray-50/50 border-t border-gray-100">
		<div class="flex items-center gap-3 p-2 rounded-xl transition-colors"
			:class="sidebarOpen ? '' : 'justify-center p-1'">
			<div
				class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center flex-shrink-0 ring-2 ring-white shadow-sm">
				<span class="text-white text-[11px] font-bold">{{ user.username|slice:":1"|upper }}</span>
			</div>
			<div x-show="sidebarOpen" x-cloak class="flex-1 min-w-0">
				<p class="text-xs font-semibold text-gray-900 truncate">{{ user.get_full_name|default:user.username }}
				</p>
				<p class="text-[10px] text-gray-400 font-medium truncate">{{ user.email|default:"mt-lims.local" }}</p>
			</div>
			<form action="{% url 'logout' %}" method="post" x-show="sidebarOpen" x-cloak>
				{% csrf_token %}
				<button type="submit"
					class="p-1.5 rounded-lg hover:bg-red-50 text-gray-400 hover:text-red-500 transition-colors">
					<i data-lucide="log-out" class="w-3.5 h-3.5"></i>
				</button>
			</form>
		</div>
	</div>
</aside>
