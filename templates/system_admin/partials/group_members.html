{% for member in members %}
<div class="flex items-center justify-between p-2.5 bg-gray-50/50 rounded-lg border border-gray-100">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-full bg-indigo-50 flex items-center justify-center flex-shrink-0 border border-indigo-100/50">
      <span class="text-indigo-600 text-[11px] font-bold">{{ member.username|slice:":1"|upper }}</span>
    </div>
    <div class="flex flex-col">
      <span class="text-[12px] font-bold text-gray-900">{{ member.get_full_name|default:member.username }}</span>
      <span class="text-[10px] text-gray-400 font-medium">{{ member.email|default:"Chưa cập nhật email" }}</span>
    </div>
  </div>
</div>
{% empty %}
<p class="text-[11px] text-gray-400 italic">Nhóm này chưa có thành viên nào.</p>
{% endfor %}
