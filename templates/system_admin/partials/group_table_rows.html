{% for g in groups %}
<tr class="group hover:bg-gray-50/50 transition-all cursor-default">
  <td class="px-5 py-3">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold text-xs border border-indigo-100/50">
        {{ g.name|slice:":1"|upper }}
      </div>
      <div class="flex flex-col">
        <span class="text-[13px] font-bold text-gray-900">{{ g.name }}</span>
        <span class="text-[10px] text-gray-400 font-medium">ID: #{{ g.id }}</span>
      </div>
    </div>
  </td>
  <td class="px-5 py-3">
    <span class="px-2 py-0.5 rounded-full bg-gray-100 text-gray-500 text-[10px] font-bold">
      {{ g.user_set.count }} thành viên
    </span>
  </td>
  <td class="px-5 py-3 text-right">
    <div class="flex items-center justify-end gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
      <a href="{% url 'group_edit' g.pk %}" class="p-1.5 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all" title="Chỉnh sửa">
        <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
      </a>
      <a href="{% url 'group_delete' g.pk %}" class="p-1.5 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all" title="Xóa">
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
      </a>
    </div>
  </td>
</tr>
{% empty %}
<tr class="empty-row">
  <td colspan="3" class="px-5 py-10 text-center">
    <div class="flex flex-col items-center gap-2">
      <i data-lucide="users-round" class="w-8 h-8 text-gray-200"></i>
      <p class="text-[13px] text-gray-400 font-medium">Không tìm thấy nhóm nào</p>
    </div>
  </td>
</tr>
{% endfor %}
