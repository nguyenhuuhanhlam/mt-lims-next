{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập | MT-LIMS</title>
  
  <!-- TailwindCSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        },
      },
    }
  </script>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    body { font-family: 'Inter', sans-serif; }
    .auth-card {
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03);
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
    }
  </style>
</head>
<body class="bg-[#FAFAFA] text-gray-900 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-[400px]">
    
    <!-- Logo -->
    <div class="flex justify-center mb-8">
      <div class="w-10 h-10 rounded-lg bg-gray-900 flex items-center justify-center shadow-sm">
        <span class="text-white text-sm font-bold">MT</span>
      </div>
    </div>

    <!-- Card -->
    <div class="bg-white border border-gray-200 rounded-xl p-8 auth-card">
      <div class="text-center mb-6">
        <h1 class="text-xl font-semibold tracking-tight">Chào mừng trở lại</h1>
        <p class="text-sm text-gray-500 mt-1">Vui lòng nhập thông tin để truy cập</p>
      </div>

      {% if form.errors %}
      <div class="mb-4 p-3 rounded-lg bg-red-50 border border-red-100 text-red-600 text-xs">
        Tên đăng nhập hoặc mật khẩu không chính xác.
      </div>
      {% endif %}

      <form method="post" action="{% url 'login' %}" class="space-y-4">
        {% csrf_token %}
        
        <div>
          <label for="id_username" class="block text-[13px] font-medium text-gray-700 mb-1.5">Tên đăng nhập</label>
          <input type="text" name="username" id="id_username" required
            class="w-full px-3 py-2 bg-white border border-gray-200 rounded-lg text-sm transition-all placeholder:text-gray-400"
            placeholder="admin">
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="id_password" class="block text-[13px] font-medium text-gray-700">Mật khẩu</label>
            <a href="#" class="text-[12px] text-blue-600 hover:underline">Quên mật khẩu?</a>
          </div>
          <input type="password" name="password" id="id_password" required
            class="w-full px-3 py-2 bg-white border border-gray-200 rounded-lg text-sm transition-all placeholder:text-gray-400"
            placeholder="••••••••">
        </div>

        <button type="submit"
          class="w-full bg-gray-900 hover:bg-gray-800 text-white text-sm font-medium py-2 rounded-lg transition-colors mt-6 shadow-sm">
          Đăng nhập
        </button>

        <input type="hidden" name="next" value="{{ next }}">
      </form>

      <!-- Divider -->
      <div class="relative my-8">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-100"></div>
        </div>
        <div class="relative flex justify-center text-[11px] uppercase">
          <span class="bg-white px-2 text-gray-400 tracking-wider">Hoặc tiếp tục với</span>
        </div>
      </div>

      <!-- Social Button Placeholder -->
      <button class="w-full border border-gray-200 hover:bg-gray-50 text-gray-700 text-sm font-medium py-2 rounded-lg transition-colors flex items-center justify-center gap-2">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google
      </button>
    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-gray-500 mt-8">
      Chưa có tài khoản? <a href="#" class="text-gray-900 font-medium hover:underline">Liên hệ quản trị viên</a>
    </p>

  </div>

</body>
</html>
